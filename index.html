<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zanetti — Fashion & Portrait Photographer in Perth, WA</title>
    <meta name="description" content="Alfredo Zanetti is a Perth-based fashion and portrait photographer shooting campaigns, model portfolios and portraits with an editorial, documentary sensibility.">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts — editorial pairing from the rebranding proposal -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web" defer></script>

    <link rel="stylesheet" href="styles.css">

    <script>
        tailwind.config = {
            theme: { extend: {
                colors: {
                    'jet-black':    '#0A0A0A',
                    'bone-white':   '#F9F8F6',
                    'warm-cotton':  '#F4EFE6',
                    'aged-gold':    '#C6A15B',
                    'dry-stone':    '#8C8882',
                    'surface-card': '#121213',
                },
                fontFamily: {
                    playfair:  ['"Playfair Display"', 'serif'],
                    cormorant: ['"Cormorant Garamond"', 'serif'],
                    sans:      ['"Inter"', 'sans-serif'],
                },
            }}
        }
    </script>
</head>
<body class="font-sans bg-jet-black text-bone-white selection:bg-aged-gold selection:text-jet-black antialiased">

    <div class="noise"></div>
    <div id="progress-bar"></div>

    <!-- Nav -->
    <nav id="main-nav" class="fixed top-0 w-full z-50 border-b border-white/5 bg-jet-black/80 backdrop-blur-xl">
        <div class="max-w-7xl mx-auto px-6 md:px-10 h-16 flex justify-between items-center">
            <a href="#home" data-tab="home" class="font-playfair italic text-xl text-bone-white tracking-widest uppercase hover:text-aged-gold transition-colors">
                Zanetti<span class="text-aged-gold">.</span>
            </a>
            <div role="tablist" aria-label="Secciones" class="hidden md:flex gap-8 text-[9px] font-sans tracking-widest uppercase">
                <!-- desktop tabs injected by main.js -->
            </div>
            <div class="flex items-center gap-3">
                <a id="nav-cta" href="#contact" data-tab="contact" class="hidden md:inline-flex bg-warm-cotton text-jet-black px-5 py-2 rounded-full font-sans text-[9px] font-semibold uppercase tracking-widest hover:bg-aged-gold transition">
                    Book Shoot
                </a>
                <button id="menu-toggle" type="button" aria-expanded="false" aria-controls="mobile-menu" aria-label="Abrir menú"
                        class="md:hidden w-9 h-9 flex items-center justify-center text-bone-white">
                    <i class="ph ph-list text-2xl"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- Mobile full-screen menu -->
    <div id="mobile-menu" aria-hidden="true"
         class="md:hidden fixed inset-0 z-40 bg-jet-black/98 backdrop-blur-xl flex flex-col items-center justify-center gap-10 opacity-0 pointer-events-none transition-opacity duration-300">
        <div role="tablist" aria-label="Secciones (móvil)" id="mobile-tabs" class="flex flex-col items-center gap-7 text-2xl font-playfair italic"></div>
        <a id="mobile-cta" href="#contact" data-tab="contact" class="bg-warm-cotton text-jet-black px-8 py-3 rounded-full font-sans text-[10px] font-semibold uppercase tracking-widest">
            Book Shoot
        </a>
    </div>

    <!-- WhatsApp flotante (oculto en Home: el hero ya tiene su propio CTA) -->
    <a id="whatsapp-float" href="#" target="_blank" rel="noopener"
       class="fixed bottom-7 right-5 z-50 flex items-center justify-center w-12 h-12 bg-[#25D366] rounded-full shadow-[0_6px_20px_rgba(37,211,102,0.45)] hover:scale-110 opacity-0 scale-75 pointer-events-none transition-all duration-300">
        <i class="ph-fill ph-whatsapp-logo text-white text-2xl"></i>
    </a>

    <main class="pt-16">

        <!-- HOME / HERO panel -->
        <section id="panel-home" role="tabpanel" aria-labelledby="tab-home" data-panel="home"
                  class="relative min-h-screen flex flex-col justify-end px-6 md:px-16 pb-20 md:pb-28">
            <!-- populated by main.js -->
        </section>

        <!-- PORTFOLIO panel -->
        <section id="panel-portfolio" role="tabpanel" aria-labelledby="tab-portfolio" data-panel="portfolio" hidden tabindex="-1"
                  class="max-w-7xl mx-auto px-6 md:px-16 py-24 space-y-16">
            <!-- populated by main.js -->
        </section>

        <!-- ABOUT panel -->
        <section id="panel-about" role="tabpanel" aria-labelledby="tab-about" data-panel="about" hidden tabindex="-1"
                  class="max-w-7xl mx-auto px-6 md:px-16 py-24">
            <!-- populated by main.js -->
        </section>

        <!-- SERVICES panel -->
        <section id="panel-services" role="tabpanel" aria-labelledby="tab-services" data-panel="services" hidden tabindex="-1"
                  class="max-w-7xl mx-auto px-6 md:px-16 py-24">
            <!-- populated by main.js -->
        </section>

        <!-- LEGAL & PERMITS panel -->
        <section id="panel-legal" role="tabpanel" aria-labelledby="tab-legal" data-panel="legal" hidden tabindex="-1"
                  class="max-w-7xl mx-auto px-6 md:px-16 py-24">
            <!-- populated by main.js -->
        </section>

        <!-- CONTACT panel -->
        <section id="panel-contact" role="tabpanel" aria-labelledby="tab-contact" data-panel="contact" hidden tabindex="-1"
                  class="max-w-7xl mx-auto px-6 md:px-16 py-24">
            <!-- populated by main.js -->
        </section>

    </main>

    <footer id="site-footer" class="border-t border-white/5 py-16 text-center px-4">
        <!-- populated by main.js -->
    </footer>

    <script src="tracking.js"></script>
    <script src="main.js"></script>
</body>
</html>
